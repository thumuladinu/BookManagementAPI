<!DOCTYPE html>
<html>
<head>
    <title>Book Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
    <h1 class="mb-4">Book Management</h1>

    <form id="bookForm" class="mb-4">
        <input type="hidden" id="bookId">
        <div class="mb-2">
            <input type="text" class="form-control" id="title" placeholder="Title" required>
        </div>
        <div class="mb-2">
            <input type="text" class="form-control" id="author" placeholder="Author" required>
        </div>
        <div class="mb-2">
            <input type="number" class="form-control" id="year" placeholder="Year" required>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
    </form>

    <table class="table table-bordered">
        <thead><tr><th>ID</th><th>Title</th><th>Author</th><th>Year</th><th>Actions</th></tr></thead>
        <tbody id="bookTable"></tbody>
    </table>

    <script>
        const apiUrl = '/api/books';

        async function loadBooks() {
            const res = await fetch(apiUrl);
            const books = await res.json();
            document.getElementById('bookTable').innerHTML = books.map(book => `
                <tr>
                    <td>${book.id}</td>
                    <td>${book.title}</td>
                    <td>${book.author}</td>
                    <td>${book.year}</td>
                    <td>
                        <button class='btn btn-sm btn-info' onclick='editBook(${JSON.stringify(book)})'>Edit</button>
                        <button class='btn btn-sm btn-danger' onclick='deleteBook(${book.id})'>Delete</button>
                    </td>
                </tr>`).join('');
        }

        function editBook(book) {
            document.getElementById('bookId').value = book.id;
            document.getElementById('title').value = book.title;
            document.getElementById('author').value = book.author;
            document.getElementById('year').value = book.year;
        }

        async function deleteBook(id) {
            await fetch(\`\${apiUrl}/\${id}\`, { method: 'DELETE' });
            loadBooks();
        }

        document.getElementById('bookForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const book = {
                id: document.getElementById('bookId').value,
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                year: parseInt(document.getElementById('year').value)
            };
            if (book.id) {
                await fetch(\`\${apiUrl}/\${book.id}\`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(book)
                });
            } else {
                await fetch(apiUrl, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(book)
                });
            }
            document.getElementById('bookForm').reset();
            loadBooks();
        });

        loadBooks();
    </script>
</body>
</html>
